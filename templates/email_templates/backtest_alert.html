<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>回測結果通知</title>
</head>

<body
    style="margin:0; padding:0; background-color:#f4f4f7; font-family:'Segoe UI','Microsoft JhengHei',Arial,sans-serif;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color:#f4f4f7; padding:20px 0;">
        <tr>
            <td align="center">

                <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                    style="background-color:#ffffff; border-radius:12px; overflow:hidden; max-width:600px; box-shadow:0 4px 20px rgba(0,0,0,0.08);">

                    <!-- 品牌區 -->
                    <tr>
                        <td
                            style="background:linear-gradient(135deg, #0a1628 0%, #1d3557 100%); padding:28px 40px; text-align:center;">
                            <h1 style="margin:0; color:#00d4ff; font-size:26px; font-weight:800; letter-spacing:2px;">
                                ROGER QUANT
                            </h1>
                            <p style="margin:6px 0 0; color:#a8b2c1; font-size:13px;">
                                策略回測分析報告
                            </p>
                        </td>
                    </tr>

                    <!-- 標題 -->
                    <tr>
                        <td style="padding:28px 40px 8px; text-align:center;">
                            <h2 style="margin:0; color:#1a1a2e; font-size:22px;">
                                📈 回測結果通知
                            </h2>
                        </td>
                    </tr>

                    <!-- 結果表格 -->
                    <tr>
                        <td style="padding:16px 40px 32px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                style="border:1px solid #e5e7eb; border-radius:8px; overflow:hidden;">

                                <tr style="background-color:#f8f9fa;">
                                    <td
                                        style="padding:14px 20px; font-size:12px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #e5e7eb;">
                                        項目</td>
                                    <td
                                        style="padding:14px 20px; font-size:12px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #e5e7eb;">
                                        數值</td>
                                </tr>

                                <tr>
                                    <td
                                        style="padding:14px 20px; font-size:14px; color:#4a5568; border-bottom:1px solid #f0f0f0;">
                                        股票代碼</td>
                                    <td
                                        style="padding:14px 20px; font-size:16px; font-weight:700; color:#1a1a2e; border-bottom:1px solid #f0f0f0;">
                                        {{ stock_code }}</td>
                                </tr>

                                <tr style="background-color:#fafbfc;">
                                    <td style="padding:14px 20px; font-size:14px; color:#4a5568;">策略名稱</td>
                                    <td
                                        style="padding:14px 20px; font-size:16px; font-weight:600; color:#1a1a2e; border-bottom:1px solid #f0f0f0;">
                                        {{ strategy_name }}</td>
                                </tr>

                                <tr>
                                    <td
                                        style="padding:14px 20px; font-size:14px; color:#4a5568; border-bottom:1px solid #f0f0f0;">
                                        勝率</td>
                                    <td
                                        style="padding:14px 20px; font-size:24px; font-weight:800; color:#10b981; border-bottom:1px solid #f0f0f0;">
                                        {{ "%.1f"|format(win_rate) }}%</td>
                                </tr>

                                <tr style="background-color:#fafbfc;">
                                    <td style="padding:14px 20px; font-size:14px; color:#4a5568;">獲利率</td>
                                    <td style="padding:14px 20px; font-size:24px; font-weight:800;
                    {% if profit_rate >= 0 %}color:#10b981;
                    {% else %}color:#ef4444;{% endif %}">
                                        {{ "%.2f"|format(profit_rate) }}%
                                    </td>
                                </tr>

                            </table>
                        </td>
                    </tr>

                    <!-- CTA -->
                    <tr>
                        <td style="padding:0 40px 32px; text-align:center;">
                            <a href="{{ url_for('analysis.backtest_page', _external=True) }}"
                                style="display:inline-block; padding:12px 32px; background:linear-gradient(135deg, #00d4ff, #0070b8); color:#ffffff; text-decoration:none; border-radius:8px; font-weight:700; font-size:14px;">
                                查看完整回測報告 →
                            </a>
                        </td>
                    </tr>

                    <!-- 底部署名 -->
                    <tr>
                        <td
                            style="background-color:#f8f9fa; padding:24px 40px; text-align:center; border-top:1px solid #e5e7eb;">
                            <p style="margin:0; font-size:12px; color:#9ca3af;">
                                此為自動發送郵件，請勿直接回覆。<br>
                                © 2026 Roger Quant. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
