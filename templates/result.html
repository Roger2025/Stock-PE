<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/script@0.1.4/index.min.js"></script>
  <title>{{ stock_id }} 價值分析報告</title>

  <style>
    /* 🚀 修正：排版擠壓與重疊問題 */
    .cheat-sheet {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px 20px;
      margin-top: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.95rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .cheat-item {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    /* 🚀 完美物理虛線 */
    .cheat-item span {
      display: inline-block;
      width: 18px;
      height: 0;
      border-top: 3px dashed;
      vertical-align: middle;
      margin-right: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px 10px;
      color: #333;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #1d3557;
      border-bottom: 3px solid #457b9d;
      padding-bottom: 15px;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .chart-section {
      text-align: center;
      margin-bottom: 40px;
      width: 100%;
    }

    .chart-section img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .ai-section {
      background-color: #f1faee;
      padding: 25px;
      border-radius: 8px;
      border-left: 6px solid #a8dadc;
      line-height: 1.8;
      font-size: 1.1em;
      overflow-wrap: break-word;
    }

    .ai-section h2 {
      color: #1d3557;
      margin-top: 0;
      display: flex;
      align-items: center;
      font-size: 1.6rem;
    }

    .ai-section h2::before {
      content: "🤖";
      margin-right: 10px;
    }

    .ai-section table {
      width: 100%;
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      white-space: nowrap;
    }

    .ai-section th,
    .ai-section td {
      padding: 8px 12px;
      border: 1px solid #ccc;
    }

    .btn-group {
      text-align: center;
      margin-top: 40px;
    }

    .back-btn {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      background-color: #e63946;
      color: white;
      padding: 15px 20px;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1.1rem;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background-color: #c1121f;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px 5px;
      }

      .container {
        padding: 20px 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .ai-section {
        padding: 15px;
        font-size: 1rem;
        line-height: 1.6;
      }

      .ai-section h2 {
        font-size: 1.3rem;
      }

      .ai-section ul {
        padding-left: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📊 {{ stock_id }} 專業價值河流圖報告</h1>

    <div class="chart-section">
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">
            本益比河流圖 (互動版)
          </h6>
        </div>
        <div class="card-body">
          <div id="river_chart" style="width: 100%; height: 500px"></div>

          <div class="cheat-sheet">
            <div class="cheat-item">
              <span style="border-color: #ff595e"></span><b>危險區</b>：極高估值，建議獲利了結
            </div>
            <div class="cheat-item">
              <span style="border-color: #ffca3a"></span><b>昂貴區</b>：估值偏高，停止追高
            </div>
            <div class="cheat-item">
              <span style="border-color: #8ac926"></span><b>平均價</b>：合理估值，持股續抱
            </div>
            <div class="cheat-item">
              <span style="border-color: #1982c4"></span><b>便宜區</b>：估值偏低，分批佈局
            </div>
            <div class="cheat-item">
              <span style="border-color: #4267b2"></span><b>超跌區</b>：極低估值，價值浮現
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="ai-section">
      <h2>AI 投資診斷建議</h2>
      {{ ai_report | safe }}
    </div>

    <div class="btn-group">
      <a href="/" class="back-btn">← 返回重新查詢</a>
    </div>
  </div>
</body>

<script type="text/javascript">
  var chartDom = document.getElementById('river_chart');
  var initChartWidth = chartDom.offsetWidth;
  var myChart = echarts.init(chartDom);
  var serverData = {{ chart_data | tojson | safe }};

  if (serverData) {
    function getResponsiveConfig(width) {
      var isMobile = width < 600;
      return {
        gridRight: isMobile ? 45 : 100,
        gridTop: isMobile ? '28%' : '22%',
        gridBottom: isMobile ? '18%' : '20%',
        fontSize: isMobile ? 11 : 13,
        legendFontSize: isMobile ? 11 : 13,
        badgeFontSize: isMobile ? 11 : 13,
        labelDistance: isMobile ? 5 : 12
      };
    }

    var layout = getResponsiveConfig(initChartWidth);
    var colors = ['#1D3557', '#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#4267B2'];

    // 🚀 神級重構：用 markLine 畫線，徹底擺脫跑版噩夢
    function createBandSeries(name, labelText, colorIndex, value) {
      return {
        name: name,
        type: 'line',
        data: Array(serverData.dates.length).fill(value), // 保留資料讓 Tooltip 讀取
        itemStyle: { color: colors[colorIndex] },
        lineStyle: { opacity: 0 }, // 隱藏原本會跑版的實體線
        symbol: 'none',
        markLine: {
          symbol: ['none', 'none'], // 不要有箭頭
          label: {
            position: 'end',
            formatter: labelText,
            color: colors[colorIndex],
            distance: layout.labelDistance,
            fontSize: layout.fontSize
          },
          lineStyle: { color: colors[colorIndex], type: 'dashed', width: 2 },
          data: [{ yAxis: value }], // 鎖死在指定的 Y 軸位置
          animation: false // 取消動畫，讓拉動滑桿時瞬間鎖定
        }
      };
    }

    var option = {
      color: colors,
      title: [
        { text: serverData.stock_name + ' (' + serverData.stock_id + ') 價值河流圖', left: 'center', top: '2%', textStyle: { color: '#1D3557', fontSize: 18 } },
        { id: 'statBadge', text: '📊 區間分佈計算中...', left: 'center', top: '8%', textStyle: { color: '#495057', fontSize: layout.badgeFontSize, fontWeight: '500' }, backgroundColor: '#F8F9FA', borderColor: '#DEE2E6', borderWidth: 1, borderRadius: 20, padding: [6, 15] }
      ],
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
      legend: {
        data: [
          { name: '本益比', icon: 'rect' }, { name: '危險區', icon: 'rect' }, { name: '昂貴區', icon: 'rect' }, { name: '合理區', icon: 'rect' }, { name: '便宜區', icon: 'rect' }, { name: '超跌區', icon: 'rect' }
        ],
        bottom: '8%', itemWidth: 24, itemHeight: 3, itemGap: 15,
        textStyle: { fontSize: layout.legendFontSize, padding: [3, 0, 0, 0] }
      },
      grid: { left: '3%', right: layout.gridRight, top: layout.gridTop, bottom: layout.gridBottom, containLabel: true },
      xAxis: { type: 'category', boundaryGap: false, data: serverData.dates },
      yAxis: { type: 'value', scale: true, splitLine: { lineStyle: { type: 'dashed', opacity: 0.3 } } },
      series: [
        { name: '本益比', type: 'line', data: serverData.pe_smooth, symbol: 'none', lineStyle: { width: 3 }, zIndex: 10, itemStyle: { color: colors[0] } },
        createBandSeries('危險區', '危險', 1, serverData.levels.極高),
        createBandSeries('昂貴區', '昂貴', 2, serverData.levels.偏高),
        createBandSeries('合理區', '合理', 3, serverData.levels.合理),
        createBandSeries('便宜區', '便宜', 4, serverData.levels.偏低),
        createBandSeries('超跌區', '超跌', 5, serverData.levels.極低)
      ],
      dataZoom: [{ type: 'slider', start: 80, end: 100, bottom: '2%', height: 25 }, { type: 'inside' }]
    };

    myChart.setOption(option);

    // 動態更新 markLine
    function updateBandSeries(value) {
      return {
        data: Array(serverData.dates.length).fill(value),
        markLine: { data: [{ yAxis: value }] } // 滑動時直接更新鎖死的 Y 軸位置
      };
    }

    myChart.on('dataZoom', function () {
      var axis = myChart.getModel().getComponent('xAxis', 0).axis;
      var range = axis.scale._extent;
      if (range && range.length === 2) {
        var startIndex = Math.floor(range[0]), endIndex = Math.ceil(range[1]);
        var activeData = serverData.pe_smooth.slice(startIndex, endIndex + 1).filter(v => v !== null);
        if (activeData.length > 0) {
          var sum = activeData.reduce((a, b) => a + b, 0), newAvg = sum / activeData.length;
          var squareDiffs = activeData.map(v => Math.pow(v - newAvg, 2));
          var newStd = Math.sqrt(squareDiffs.reduce((a, b) => a + b, 0) / activeData.length);

          // 🚀 核心升級：從後端抓取策略參數 (防呆：如果沒抓到預設給 1.5 和 0.5)
          var highMult = (serverData.config && serverData.config.high_multiplier) ? serverData.config.high_multiplier : 1.5;
          var midMult = (serverData.config && serverData.config.mid_multiplier) ? serverData.config.mid_multiplier : 0.5;

          var counts = { h2: 0, h1: 0, f: 0, l1: 0, l2: 0 };
          activeData.forEach(pe => {
            // 🚀 替換成變數 highMult 與 midMult
            if (pe > newAvg + highMult * newStd) counts.h2++;
            else if (pe > newAvg + midMult * newStd) counts.h1++;
            else if (pe >= newAvg - midMult * newStd) counts.f++;
            else if (pe >= newAvg - highMult * newStd) counts.l1++;
            else counts.l2++;
          });

          var total = activeData.length;
          var formatPct = (c) => ((c / total) * 100).toFixed(0) + '%';
          var statStr = `分佈: 危險 ${formatPct(counts.h2)} ｜ 昂貴 ${formatPct(counts.h1)} ｜ 合理 ${formatPct(counts.f)} ｜ 便宜 ${formatPct(counts.l1)} ｜ 超跌 ${formatPct(counts.l2)}`;

          myChart.setOption({
            title: [{}, { id: 'statBadge', text: statStr }],
            series: [
              {}, // pe_smooth 不動
              updateBandSeries(newAvg + highMult * newStd), // 🚀 替換成變數
              updateBandSeries(newAvg + midMult * newStd),  // 🚀 替換成變數
              updateBandSeries(newAvg),                     // 均線不動
              updateBandSeries(newAvg - midMult * newStd),  // 🚀 替換成變數
              updateBandSeries(newAvg - highMult * newStd)  // 🚀 替換成變數
            ]
          });
        }
      }
    });
    myChart.dispatchAction({ type: 'dataZoom', start: 80, end: 100 });
  }

  window.addEventListener('resize', function () {
    var newWidth = chartDom.offsetWidth;
    var newLayout = getResponsiveConfig(newWidth);
    myChart.setOption({
      grid: { right: newLayout.gridRight, top: newLayout.gridTop, bottom: newLayout.gridBottom },
      series: [
        {},
        { markLine: { label: { distance: newLayout.labelDistance } } },
        { markLine: { label: { distance: newLayout.labelDistance } } },
        { markLine: { label: { distance: newLayout.labelDistance } } },
        { markLine: { label: { distance: newLayout.labelDistance } } },
        { markLine: { label: { distance: newLayout.labelDistance } } }
      ]
    });
    myChart.resize();
  });
</script>

</html>
