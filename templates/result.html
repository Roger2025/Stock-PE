<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/script@0.1.4/index.min.js"></script>
    <title>{{ stock_id }} 價值分析報告</title>

    <style>
      /* 🚀 修正：排版擠壓與重疊問題 */
      .cheat-sheet {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px 20px;
        margin-top: 20px; /* 🚀 這裡把 -20px 改成正的 20px，就不會跟拉桿黏在一起了！ */
        margin-bottom: 30px;
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap; /* 🚀 允許換行：手機螢幕太小時不會全擠在一排 */
        gap: 10px; /* 換行時的間距 */
        font-size: 0.95rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      .cheat-item {
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      /* 🚀 修正：把原本的實心圓點改成跟圖表一致的「虛線」樣式 */
      .cheat-item span {
        display: inline-block;
        width: 18px;
        height: 0;
        border-top: 3px dashed; /* 變成虛線 */
        margin-right: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Microsoft JhengHei", sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 20px 10px;
        color: #333;
      }
      .container {
        max-width: 900px;
        width: 100%;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #1d3557;
        border-bottom: 3px solid #457b9d;
        padding-bottom: 15px;
        margin-bottom: 30px;
        font-size: 2rem;
      }
      .chart-section {
        text-align: center;
        margin-bottom: 40px;
        width: 100%;
      }
      .chart-section img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        border: 1px solid #ddd;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .ai-section {
        background-color: #f1faee;
        padding: 25px;
        border-radius: 8px;
        border-left: 6px solid #a8dadc;
        line-height: 1.8;
        font-size: 1.1em;
        overflow-wrap: break-word;
      }
      .ai-section h2 {
        color: #1d3557;
        margin-top: 0;
        display: flex;
        align-items: center;
        font-size: 1.6rem;
      }
      .ai-section h2::before {
        content: "🤖";
        margin-right: 10px;
      }
      .ai-section table {
        width: 100%;
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
        white-space: nowrap;
      }
      .ai-section th,
      .ai-section td {
        padding: 8px 12px;
        border: 1px solid #ccc;
      }
      .btn-group {
        text-align: center;
        margin-top: 40px;
      }
      .back-btn {
        display: inline-block;
        width: 100%;
        max-width: 300px;
        background-color: #e63946;
        color: white;
        padding: 15px 20px;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 1.1rem;
        transition: background 0.3s;
      }
      .back-btn:hover {
        background-color: #c1121f;
      }

      @media (max-width: 600px) {
        body {
          padding: 10px 5px;
        }
        .container {
          padding: 20px 15px;
        }
        h1 {
          font-size: 1.5rem;
        }
        .ai-section {
          padding: 15px;
          font-size: 1rem;
          line-height: 1.6;
        }
        .ai-section h2 {
          font-size: 1.3rem;
        }
        .ai-section ul {
          padding-left: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📊 {{ stock_id }} 專業價值河流圖報告</h1>

      <div class="chart-section">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
              本益比河流圖 (互動版)
            </h6>
          </div>
          <div class="card-body">
            <div id="river_chart" style="width: 100%; height: 500px"></div>

            <div class="cheat-sheet">
              <div class="cheat-item">
                <span style="border-color: #ff595e"></span
                ><b>危險區</b>：極高估值，建議獲利了結
              </div>
              <div class="cheat-item">
                <span style="border-color: #ffca3a"></span
                ><b>昂貴區</b>：估值偏高，停止追高
              </div>
              <div class="cheat-item">
                <span style="border-color: #8ac926"></span
                ><b>平均價</b>：合理估值，持股續抱
              </div>
              <div class="cheat-item">
                <span style="border-color: #1982c4"></span
                ><b>便宜區</b>：估值偏低，分批佈局
              </div>
              <div class="cheat-item">
                <span style="border-color: #4267b2"></span
                ><b>超跌區</b>：極低估值，價值浮現
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="ai-section">
        <h2>AI 投資診斷建議</h2>
        {{ ai_report | safe }}
      </div>

      <div class="btn-group">
        <a href="/" class="back-btn">← 返回重新查詢</a>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var chartDom = document.getElementById('river_chart');
    var myChart = echarts.init(chartDom);
    var serverData = {{ chart_data | tojson | safe }};

    if (serverData) {
        function getResponsiveConfig(width) {
            if (width < 600) {
                return { gridRight: 35, gridTop: 150, fontSize: 10, legendFontSize: 11, graphicWidth: 360, statFontSize: 10, graphicTop: '20%' };
            } else if (width < 900) {
                return { gridRight: 45, gridTop: 110, fontSize: 12, legendFontSize: 12, graphicWidth: 480, statFontSize: 12, graphicTop: '15%' };
            } else {
                return { gridRight: 50, gridTop: 100, fontSize: 13, legendFontSize: 13, graphicWidth: 580, statFontSize: 13, graphicTop: '14%' };
            }
        }

        var initChartWidth = chartDom.offsetWidth;
        var layout = getResponsiveConfig(initChartWidth);

        var option = {
            color: ['#1D3557', '#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#4267B2'],
            title: { text: serverData.stock_name + ' (' + serverData.stock_id + ') 價值河流圖', left: 'center', top: '2%' },
            tooltip: {
                trigger: 'axis', axisPointer: { type: 'cross' }, backgroundColor: 'rgba(255, 255, 255, 0.95)',
                valueFormatter: function (value) { return value ? Number(value).toFixed(2) : '-'; }
            },

            // 🚀 核心修復：拿掉錯誤的 path SVG，恢復 type: 'scroll'。
            // 只要這裡的名稱跟下方 series 一模一樣，ECharts 就會自動畫出超完美的虛線圖示！
            legend: {
                type: 'scroll',
                data: ['本益比', '極高 (危險區)', '偏高 (昂貴區)', '合理 (平均價)', '偏低 (便宜區)', '極低 (超跌區)'],
                top: '8%',
                textStyle: { fontSize: layout.legendFontSize }
            },
            grid: { left: '3%', right: layout.gridRight, top: layout.gridTop, bottom: '15%', containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: serverData.dates, axisLabel: { color: '#666' } },
            yAxis: { type: 'value', scale: true, axisLabel: { color: '#666' }, splitLine: { lineStyle: { type: 'dashed', opacity: 0.3 } } },

            series: [
                { name: '本益比', type: 'line', data: serverData.pe_smooth, symbol: 'none', lineStyle: { width: 3 }, zIndex: 10 },
                // 維持你的 markLine 邏輯，確保文字死死釘住
                { name: '極高 (危險區)', type: 'line', data: [], markLine: { symbol: 'none', animation: false, silent: true, label: { position: 'end', formatter: '危險', color: '#FF595E', fontSize: layout.fontSize }, lineStyle: { type: 'dashed', color: '#FF595E', width: 1 }, data: [{ yAxis: serverData.levels.極高 }] } },
                { name: '偏高 (昂貴區)', type: 'line', data: [], markLine: { symbol: 'none', animation: false, silent: true, label: { position: 'end', formatter: '昂貴', color: '#FFCA3A', fontSize: layout.fontSize }, lineStyle: { type: 'dashed', color: '#FFCA3A', width: 1 }, data: [{ yAxis: serverData.levels.偏高 }] } },
                { name: '合理 (平均價)', type: 'line', data: [], markLine: { symbol: 'none', animation: false, silent: true, label: { position: 'end', formatter: '合理', color: '#8AC926', fontSize: layout.fontSize }, lineStyle: { type: 'dashed', color: '#8AC926', width: 1 }, data: [{ yAxis: serverData.levels.合理 }] } },
                { name: '偏低 (便宜區)', type: 'line', data: [], markLine: { symbol: 'none', animation: false, silent: true, label: { position: 'end', formatter: '便宜', color: '#1982C4', fontSize: layout.fontSize }, lineStyle: { type: 'dashed', color: '#1982C4', width: 1 }, data: [{ yAxis: serverData.levels.偏低 }] } },
                { name: '極低 (超跌區)', type: 'line', data: [], markLine: { symbol: 'none', animation: false, silent: true, label: { position: 'end', formatter: '超跌', color: '#4267B2', fontSize: layout.fontSize }, lineStyle: { type: 'dashed', color: '#4267B2', width: 1 }, data: [{ yAxis: serverData.levels.極低 }] } }
            ],
            dataZoom: [{ type: 'slider', start: 80, end: 100, bottom: '5%' }, { type: 'inside' }],
            graphic: [{
                type: 'group', left: 'center', top: layout.graphicTop,
                children: [
                    { type: 'rect', z: 100, shape: { width: layout.graphicWidth, height: 28 }, style: { fill: 'rgba(255, 255, 255, 0.95)', stroke: '#ccc', lineWidth: 1, shadowBlur: 4, shadowColor: 'rgba(0,0,0,0.1)', radius: 5 } },
                    { type: 'text', z: 101, left: 10, top: 8, style: { text: '載入區間統計中...', font: `bold ${layout.statFontSize}px "Microsoft JhengHei", sans-serif`, fill: '#333' }, id: 'statText' }
                ]
            }]
        };

        myChart.setOption(option);

        // 這裡完全是你原本的動態重算邏輯，一字未改！
        myChart.on('dataZoom', function () {
            var axis = myChart.getModel().getComponent('xAxis', 0).axis;
            var range = axis.scale._extent;

            if (range && range.length === 2) {
                var startIndex = Math.floor(range[0]);
                var endIndex = Math.ceil(range[1]);
                var activeData = serverData.pe_smooth.slice(startIndex, endIndex + 1).filter(v => v !== null);

                if (activeData.length > 0) {
                    var sum = activeData.reduce((a, b) => a + b, 0);
                    var newAvg = sum / activeData.length;
                    var squareDiffs = activeData.map(v => Math.pow(v - newAvg, 2));
                    var newStd = Math.sqrt(squareDiffs.reduce((a, b) => a + b, 0) / activeData.length);

                    var counts = { high2: 0, high1: 0, fair: 0, low1: 0, low2: 0 };
                    activeData.forEach(pe => {
                        if (pe > newAvg + 1.5 * newStd) counts.high2++;
                        else if (pe > newAvg + 0.5 * newStd) counts.high1++;
                        else if (pe >= newAvg - 0.5 * newStd) counts.fair++;
                        else if (pe >= newAvg - 1.5 * newStd) counts.low1++;
                        else counts.low2++;
                    });

                    var total = activeData.length;
                    var p = (c) => (c / total * 100).toFixed(0) + '%';

                    var statStr = `📊 當前PE估值區間佔比 (${serverData.stock_name}): 危險 ${p(counts.high2)} | 昂貴 ${p(counts.high1)} | 合理 ${p(counts.fair)} | 便宜 ${p(counts.low1)} | 超跌 ${p(counts.low2)}`;

                    myChart.setOption({
                        graphic: { id: 'statText', style: { text: statStr } },
                        series: [
                            { name: '極高 (危險區)', markLine: { data: [{ yAxis: newAvg + 1.5 * newStd }] } },
                            { name: '偏高 (昂貴區)', markLine: { data: [{ yAxis: newAvg + 0.5 * newStd }] } },
                            { name: '合理 (平均價)', markLine: { data: [{ yAxis: newAvg }] } },
                            { name: '偏低 (便宜區)', markLine: { data: [{ yAxis: newAvg - 0.5 * newStd }] } },
                            { name: '極低 (超跌區)', markLine: { data: [{ yAxis: newAvg - 1.5 * newStd }] } }
                        ]
                    });
                }
            }
        });
        myChart.dispatchAction({ type: 'dataZoom', start: 80, end: 100 });
    }

    window.addEventListener('resize', function() {
        var currentWidth = chartDom.offsetWidth;
        var currentLayout = getResponsiveConfig(currentWidth);

        myChart.setOption({
            legend: { textStyle: { fontSize: currentLayout.legendFontSize } },
            grid: { right: currentLayout.gridRight, top: currentLayout.gridTop },
            graphic: [{ id: 'statText', style: { font: `bold ${currentLayout.statFontSize}px "Microsoft JhengHei", sans-serif` } }],
            series: [
                {},
                { markLine: { label: { fontSize: currentLayout.fontSize } } },
                { markLine: { label: { fontSize: currentLayout.fontSize } } },
                { markLine: { label: { fontSize: currentLayout.fontSize } } },
                { markLine: { label: { fontSize: currentLayout.fontSize } } },
                { markLine: { label: { fontSize: currentLayout.fontSize } } }
            ]
        });
        myChart.resize();
    });
  </script>
</html>
