<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/script@0.1.4/index.min.js"></script>
    <title>{{ stock_id }} 價值分析報告</title>
  
    <style>
      .cheat-sheet {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px 20px;
        margin-top: -20px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-around;
        font-size: 0.95rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      .cheat-item span {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Microsoft JhengHei", sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 20px 10px; /* 電腦版留白，手機版靠邊界近一點 */
        color: #333;
      }
      .container {
        max-width: 900px;
        width: 100%;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #1d3557;
        border-bottom: 3px solid #457b9d;
        padding-bottom: 15px;
        margin-bottom: 30px;
        font-size: 2rem;
      }
      .chart-section {
        text-align: center;
        margin-bottom: 40px;
        width: 100%;
      }
      .chart-section img {
        max-width: 100%; /* 靈魂設定：圖片永遠不會超出螢幕寬度 */
        height: auto;
        border-radius: 8px;
        border: 1px solid #ddd;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .ai-section {
        background-color: #f1faee;
        padding: 25px;
        border-radius: 8px;
        border-left: 6px solid #a8dadc;
        line-height: 1.8;
        font-size: 1.1em;
        overflow-wrap: break-word; /* 避免過長的英文或網址撐破畫面 */
      }
      .ai-section h2 {
        color: #1d3557;
        margin-top: 0;
        display: flex;
        align-items: center;
        font-size: 1.6rem;
      }
      .ai-section h2::before {
        content: "🤖";
        margin-right: 10px;
      }
      /* 如果 AI 生成了 Markdown 表格，讓它可以左右滑動 */
      .ai-section table {
        width: 100%;
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
        white-space: nowrap;
      }
      .ai-section th,
      .ai-section td {
        padding: 8px 12px;
        border: 1px solid #ccc;
      }
      .btn-group {
        text-align: center;
        margin-top: 40px;
      }
      .back-btn {
        display: inline-block;
        width: 100%; /* 手機上變滿版大按鈕 */
        max-width: 300px; /* 電腦上維持適中大小 */
        background-color: #e63946;
        color: white;
        padding: 15px 20px;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 1.1rem;
        transition: background 0.3s;
      }
      .back-btn:hover {
        background-color: #c1121f;
      }

      /* ================================ */
      /* 手機版 (寬度小於 600px) 自動切換設定 */
      /* ================================ */
      @media (max-width: 600px) {
        body {
          padding: 10px 5px;
        }
        .container {
          padding: 20px 15px;
        }
        h1 {
          font-size: 1.5rem;
        }
        .ai-section {
          padding: 15px;
          font-size: 1rem;
          line-height: 1.6;
        }
        .ai-section h2 {
          font-size: 1.3rem;
        }
        .ai-section ul {
          padding-left: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📊 {{ stock_id }} 專業價值河流圖報告</h1>

      <div class="chart-section">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
              本益比河流圖 (互動版)
            </h6>
          </div>
          <div class="card-body">
            <div id="river_chart" style="width: 100%; height: 500px"></div>
          </div>
        </div>
      </div>

      <div class="ai-section">
        <h2>AI 投資診斷建議</h2>
        {{ ai_report | safe }}
      </div>

      <div class="btn-group">
        <a href="/" class="back-btn">← 返回重新查詢</a>
      </div>
    </div>
  </body>
  <div class="card-body">
            <div id="river_chart" style="width: 100%; height: 500px"></div>
            
            <div class="cheat-sheet">
                <div class="cheat-item"><span style="background: #FF595E;"></span><b>危險區</b>：極高估值，建議獲利了結</div>
                <div class="cheat-item"><span style="background: #FFCA3A;"></span><b>昂貴區</b>：估值偏高，停止追高</div>
                <div class="cheat-item"><span style="background: #8AC926;"></span><b>平均價</b>：合理估值，持股續抱</div>
                <div class="cheat-item"><span style="background: #1982C4;"></span><b>便宜區</b>：估值偏低，分批佈局</div>
                <div class="cheat-item"><span style="background: #4267B2;"></span><b>超跌區</b>：極低估值，價值浮現</div>
            </div>
          </div>
        </div>
      </div>

  <script type="text/javascript">
    var chartDom = document.getElementById('river_chart');
    var myChart = echarts.init(chartDom);
    var serverData = {{ chart_data | tojson | safe }};

    var isMobile = window.innerWidth <= 600;

    if (serverData) {
        var option = {
            color: ['#1D3557', '#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#4267B2'],
            title: { 
                text: serverData.stock_name + ' (' + serverData.stock_id + ') 價值河流圖', 
                left: 'center', 
                top: '0%',
                textStyle: { fontSize: isMobile ? 15 : 18 }
            },
            tooltip: { 
                trigger: 'axis', axisPointer: { type: 'cross' }, backgroundColor: 'rgba(255, 255, 255, 0.95)', confine: true,
                valueFormatter: function (value) { return value ? Number(value).toFixed(2) : '-'; }
            },
            // 🚀 完整保留圖例文字，手機版字體縮到 9 確保不會爆版
            legend: { 
                data: ['本益比', '極高 (危險區)', '偏高 (昂貴區)', '合理 (平均價)', '偏低 (便宜區)', '極低 (超跌區)'], 
                top: isMobile ? '8%' : '8%', 
                textStyle: { fontSize: isMobile ? 9 : 12 },
                itemWidth: isMobile ? 10 : 25,
                itemGap: isMobile ? 4 : 10
            },
            grid: { 
                // 🚀 極限排版：上面留 40% 放字，右邊留 25% 放完整標籤
                top: isMobile ? '40%' : '18%', 
                left: '3%', 
                right: isMobile ? '25%' : '12%', 
                bottom: '15%', 
                containLabel: true 
            },
            xAxis: { type: 'category', boundaryGap: false, data: serverData.dates, axisLabel: { color: '#666' } },
            yAxis: { type: 'value', scale: true, axisLabel: { color: '#666' }, splitLine: { lineStyle: { type: 'dashed', opacity: 0.3 } } },
            series: [
                { name: '本益比', type: 'line', data: serverData.pe_smooth, symbol: 'none', lineStyle: { width: 3 }, zIndex: 10 },
                
                // 🚀 完整保留右側標籤文字 (拿掉 split縮寫邏輯)，手機版字體縮到 9
                { name: '極高 (危險區)', type: 'line', data: Array(serverData.dates.length).fill(serverData.levels.極高), lineStyle: { type: 'dashed', width: 1 }, symbol: 'none', 
                  endLabel: { show: true, formatter: '{a}', color: 'inherit', distance: isMobile ? 2 : 10, fontSize: isMobile ? 9 : 12 } },
                { name: '偏高 (昂貴區)', type: 'line', data: Array(serverData.dates.length).fill(serverData.levels.偏高), lineStyle: { type: 'dashed', width: 1 }, symbol: 'none', 
                  endLabel: { show: true, formatter: '{a}', color: 'inherit', distance: isMobile ? 2 : 10, fontSize: isMobile ? 9 : 12 } },
                { name: '合理 (平均價)', type: 'line', data: Array(serverData.dates.length).fill(serverData.levels.合理), lineStyle: { type: 'dashed', width: 1 }, symbol: 'none', 
                  endLabel: { show: true, formatter: '{a}', color: 'inherit', distance: isMobile ? 2 : 10, fontSize: isMobile ? 9 : 12 } },
                { name: '偏低 (便宜區)', type: 'line', data: Array(serverData.dates.length).fill(serverData.levels.偏低), lineStyle: { type: 'dashed', width: 1 }, symbol: 'none', 
                  endLabel: { show: true, formatter: '{a}', color: 'inherit', distance: isMobile ? 2 : 10, fontSize: isMobile ? 9 : 12 } },
                { name: '極低 (超跌區)', type: 'line', data: Array(serverData.dates.length).fill(serverData.levels.極低), lineStyle: { type: 'dashed', width: 1 }, symbol: 'none', 
                  endLabel: { show: true, formatter: '{a}', color: 'inherit', distance: isMobile ? 2 : 10, fontSize: isMobile ? 9 : 12 } }
            ],
            dataZoom: [{ type: 'slider', start: 80, end: 100, bottom: '5%' }, { type: 'inside' }],
            
            // 🚀 完整保留統計面板
            graphic: [{
                type: 'group', left: 'center', top: isMobile ? '28%' : '14%',
                children: [
                    { type: 'rect', z: 100, shape: { width: isMobile ? 320 : 450, height: isMobile ? 22 : 32 }, style: { fill: 'rgba(255, 255, 255, 0.95)', stroke: '#ccc', lineWidth: 1, shadowBlur: 4, shadowColor: 'rgba(0,0,0,0.1)', radius: 5 } }, 
                    { type: 'text', z: 101, left: isMobile ? 5 : 15, top: isMobile ? 5 : 10, style: { text: '計算中...', font: isMobile ? '10px "Microsoft JhengHei"' : '13px "Microsoft JhengHei", sans-serif', fill: '#333', fontWeight: 'bold' }, id: 'statText' }
                ]
            }]
        };

        myChart.setOption(option);

        myChart.on('dataZoom', function () {
            var axis = myChart.getModel().getComponent('xAxis', 0).axis;
            var range = axis.scale._extent;

            if (range && range.length === 2) {
                var startIndex = Math.floor(range[0]);
                var endIndex = Math.ceil(range[1]);
                var activeData = serverData.pe_smooth.slice(startIndex, endIndex + 1).filter(v => v !== null);

                if (activeData.length > 0) {
                    var sum = activeData.reduce((a, b) => a + b, 0);
                    var newAvg = sum / activeData.length;
                    var squareDiffs = activeData.map(v => Math.pow(v - newAvg, 2));
                    var newStd = Math.sqrt(squareDiffs.reduce((a, b) => a + b, 0) / activeData.length);

                    var counts = { high: 0, fair: 0, low: 0 };
                    activeData.forEach(pe => {
                        if (pe > newAvg + 0.5 * newStd) counts.high++;
                        else if (pe >= newAvg - 0.5 * newStd) counts.fair++;
                        else counts.low++;
                    });

                    var total = activeData.length;
                    
                    // 🚀 完整保留所有文字
                    var statStr = `📊 區間特性： 偏高昂貴 ${(counts.high/total*100).toFixed(0)}% ｜ 合理震盪 ${(counts.fair/total*100).toFixed(0)}% ｜ 偏低便宜 ${(counts.low/total*100).toFixed(0)}%`;

                    myChart.setOption({
                        graphic: { id: 'statText', style: { text: statStr } },
                        series: [
                            { name: '極高 (危險區)', data: Array(serverData.dates.length).fill(newAvg + 1.5 * newStd) },
                            { name: '偏高 (昂貴區)', data: Array(serverData.dates.length).fill(newAvg + 0.5 * newStd) },
                            { name: '合理 (平均價)', data: Array(serverData.dates.length).fill(newAvg) },
                            { name: '偏低 (便宜區)', data: Array(serverData.dates.length).fill(newAvg - 0.5 * newStd) },
                            { name: '極低 (超跌區)', data: Array(serverData.dates.length).fill(newAvg - 1.5 * newStd) }
                        ]
                    });
                }
            }
        });
        myChart.dispatchAction({ type: 'dataZoom', start: 80, end: 100 });
    }
    
    window.addEventListener('resize', function() { 
        isMobile = window.innerWidth <= 600;
        myChart.resize(); 
    });
</script>
</html>
